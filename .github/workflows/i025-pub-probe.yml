name: i025-pub-probe
on:
  workflow_dispatch:
    inputs:
      phase:
        description: probe phase
        required: true
        type: choice
        default: create_pending
        options:
        - create_pending
        - author_probe
        - edit_pending
        - submit
        - delete_pending
        - post_submit_probe
        - delete_comment
      pr:
        description: pull request number
        required: false
        default: '1'
      review_id:
        description: explicit review id (optional)
        required: false
        default: ''
      comment_id:
        description: explicit comment id (optional)
        required: false
        default: ''
permissions:
  pull-requests: write
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GT: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: run phase
        shell: bash
        env:
          PHASE: ${{ github.event.inputs.phase }}
          PR: ${{ github.event.inputs.pr }}
          RID_IN: ${{ github.event.inputs.review_id }}
          CID_IN: ${{ github.event.inputs.comment_id }}
        run: |
          set -u
          API="https://api.github.com/repos/$REPO"
          GQL="https://api.github.com/graphql"
          TS=$(date +%s%3N)
          H=(-H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json")
          echo "I025RUN repo=$REPO pr=$PR phase=$PHASE ts=$TS"
          jqtrim='{id,node_id,state,body,submitted_at,created_at,user:{login:.user.login,id:.user.id},commit_id,author_association,html_url}'
          list_reviews() {
            curl -sS -o /tmp/list.json -w 'I025RES reviews_list code=%{http_code}\n' "${H[@]}" "$API/pulls/$PR/reviews?per_page=100"
            jq -c 'map({id,state,body,submitted_at,created_at,user:.user.login,commit_id})' /tmp/list.json 2>/dev/null || head -c 1000 /tmp/list.json
            for RID in $(jq -r '.[] | select(.state=="PENDING") | .id' /tmp/list.json 2>/dev/null); do
              curl -sS -o /tmp/rc_$RID.json -w "I025RES per_review_comments rid=$RID code=%{http_code}\n" "${H[@]}" "$API/pulls/$PR/reviews/$RID/comments"
              jq -c 'map({id,body,path,line,created_at,updated_at,user:.user.login,in_reply_to_id,pull_request_review_id,commit_id})' /tmp/rc_$RID.json 2>/dev/null | head -c 3000
              echo
            done
          }
          case "$PHASE" in
          create_pending)
            BODY="i025 priv bot PENDING body marker: i025-pub-bot-body-$TS"
            CBODY="i025 priv bot PENDING cmt marker: i025-pub-bot-$TS @qret2libc @wyxxl"
            PAYLOAD=$(jq -n --arg body "$BODY" --arg cbody "$CBODY" '{body:$body,comments:[{path:"pr_probe.txt",line:1,side:"RIGHT",body:$cbody}]}')
            echo "I025REQ create_pending payload=$PAYLOAD"
            CODE=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "${H[@]}" -X POST "$API/pulls/$PR/reviews" --data "$PAYLOAD")
            echo "I025RES create_pending code=$CODE"
            jq -c "$jqtrim" /tmp/resp.json 2>/dev/null || head -c 1200 /tmp/resp.json
            list_reviews
            ;;
          author_probe)
            list_reviews
            echo "I025OWNER comments_list:"
            curl -sS -o /tmp/comments.json -w 'I025RES comments_list code=%{http_code}\n' "${H[@]}" "$API/pulls/$PR/comments?per_page=100"
            jq -c 'map({id,body,path,line,created_at,updated_at,user:.user.login,in_reply_to_id,pull_request_review_id})' /tmp/comments.json 2>/dev/null | head -c 3000
            echo
            for CID in $(jq -r '.[].id // empty' /tmp/comments.json 2>/dev/null); do
              curl -sS -o /tmp/cmt_$CID.json -w "I025RES comment_by_global_id id=$CID code=%{http_code}\n" "${H[@]}" "$API/pulls/comments/$CID"
              jq -c '{id,body,path,line,created_at,updated_at,user:.user.login,in_reply_to_id,pull_request_review_id,html_url}' /tmp/cmt_$CID.json 2>/dev/null || head -c 600 /tmp/cmt_$CID.json
            done
            echo "I025OWNER timeline:"
            curl -sS -o /tmp/timeline.json -w 'I025RES timeline code=%{http_code}\n' "${H[@]}" "$API/issues/$PR/timeline?per_page=100"
            jq -c 'map({event,id,actor:(.actor.login//null),created_at,body:(.body//null),review:(if .review then {id:.review.id,state:.review.state,body:.review.body,user:.review.user.login} else null end)})' /tmp/timeline.json 2>/dev/null | head -c 4000
            echo
            echo "I025OWNER repo_events:"
            curl -sS -o /tmp/revents.json -w 'I025RES repo_events code=%{http_code}\n' "${H[@]}" "$API/repos/$REPO/events?per_page=100"
            jq -c 'map({id,type,created_at,actor:.actor.login,repo:.repo.name,payload_type:.payload.action,review_id:((.payload.comment//{}) .pull_request_review_id // null)})' /tmp/revents.json 2>/dev/null | head -c 4000
            echo
            echo "I025OWNER qret2libc_user_events:"
            curl -sS -o /tmp/ue1.json -w 'I025RES qret2libc_events code=%{http_code}\n' "${H[@]}" "https://api.github.com/users/qret2libc/events?per_page=100"
            jq -c 'map({id,type,created_at,actor:.actor.login,repo:.repo.name})' /tmp/ue1.json 2>/dev/null | head -c 3000
            echo
            echo "I025OWNER qret2libc_public_events:"
            curl -sS -o /tmp/ue2.json -w 'I025RES qret2libc_public_events code=%{http_code}\n' "${H[@]}" "https://api.github.com/users/qret2libc/events/public?per_page=100"
            jq -c 'map({id,type,created_at,actor:.actor.login,repo:.repo.name})' /tmp/ue2.json 2>/dev/null | head -c 3000
            echo
            echo "I025OWNER graphql:"
            GQ=$(jq -n --arg q 'query($owner:String!,$name:String!,$num:Int!){repository(owner:$owner,name:$name){pullRequest(number:$num){number reviewDecision reviews(first:50){totalCount nodes{id databaseId state body submittedAt createdAt author{login} comments(first:100){totalCount nodes{id databaseId body path line createdAt author{login}}}}} reviewThreads(first:50){totalCount nodes{id path line isResolved comments(first:100){totalCount nodes{id databaseId body path line createdAt author{login}}}}} timelineItems(first:80){nodes{__typename ... on PullRequestReview{id databaseId state body submittedAt author{login}} ... on PullRequestReviewThread{id path comments(first:20){totalCount nodes{id databaseId body path author{login}}}}}}}}}}' '{query:$q,variables:{owner:"qret2libc",name:"pridor-lifecycle-20260904",num:1}}')
            curl -sS -o /tmp/gql.json -w 'I025RES graphql code=%{http_code}\n' -H "Authorization: Bearer $GT" -H "Content-Type: application/json" --data-binary "$GQ" "$GQL"
            jq -c '.' /tmp/gql.json 2>/dev/null | head -c 5000
            echo
            echo "I025MARKERSCAN phase=author_probe:"
            grep -oE 'i025-pub-bot-[A-Za-z-]+[0-9]*' /tmp/*.json 2>/dev/null | sort -u | head -20
            ;;
          edit_pending)
            if [ -n "$CID_IN" ]; then
              EDBODY="i025 priv bot PENDING cmt EDITED marker: i025-pub-bot-edit-$TS @qret2libc"
              PAYLOAD=$(jq -n --arg b "$EDBODY" '{body:$b}')
              curl -sS -o /tmp/edit.json -w 'I025RES edit_pending_comment code=%{http_code}\n' "${H[@]}" -X PATCH "$API/pulls/comments/$CID_IN" --data "$PAYLOAD"
              jq -c '{id,body,path,line,created_at,updated_at,user:.user.login,pull_request_review_id}' /tmp/edit.json 2>/dev/null || head -c 800 /tmp/edit.json
              echo
              list_reviews
            fi
            ;;
          submit)
            RID="$RID_IN"
            if [ -z "$RID" ]; then
              curl -sS -o /tmp/list.json "${H[@]}" "$API/pulls/$PR/reviews?per_page=100"
              RID=$(jq -r '.[] | select(.state=="PENDING") | .id' /tmp/list.json 2>/dev/null | head -1)
            fi
            echo "I025 submit target rid=$RID"
            if [ -n "$RID" ]; then
              SPAYLOAD=$(jq -n --arg m "i025 priv bot SUBMIT body marker: i025-pub-bot-submit-$TS" '{event:"COMMENT",body:$m}')
              curl -sS -o /tmp/sub.json -w 'I025RES submit code=%{http_code}\n' "${H[@]}" -X POST "$API/pulls/$PR/reviews/$RID/events" --data "$SPAYLOAD"
              jq -c "$jqtrim" /tmp/sub.json 2>/dev/null || head -c 800 /tmp/sub.json
              echo
            fi
            ;;
          delete_pending)
            RID="$RID_IN"
            if [ -z "$RID" ]; then
              curl -sS -o /tmp/list.json "${H[@]}" "$API/pulls/$PR/reviews?per_page=100"
              RID=$(jq -r '.[] | select(.state=="PENDING") | .id' /tmp/list.json 2>/dev/null | head -1)
            fi
            echo "I025 delete_pending target rid=$RID"
            if [ -n "$RID" ]; then
              curl -sS -o /tmp/del.json -w 'I025RES delete_pending code=%{http_code}\n' "${H[@]}" -X DELETE "$API/pulls/$PR/reviews/$RID"
              head -c 600 /tmp/del.json
              echo
              list_reviews
            fi
            ;;
          post_submit_probe)
            echo "I025POSTSUBMIT reviews_list:"
            curl -sS -o /tmp/list.json -w 'I025RES reviews_list code=%{http_code}\n' "${H[@]}" "$API/pulls/$PR/reviews?per_page=100"
            jq -c 'map({id,state,body,submitted_at,user:.user.login})' /tmp/list.json 2>/dev/null | head -c 2000
            echo
            echo "I025POSTSUBMIT comments_list:"
            curl -sS -o /tmp/comments.json -w 'I025RES comments_list code=%{http_code}\n' "${H[@]}" "$API/pulls/$PR/comments?per_page=100"
            jq -c 'map({id,body,path,line,created_at,user:.user.login,pull_request_review_id})' /tmp/comments.json 2>/dev/null | head -c 2000
            echo
            for CID in $(jq -r '.[].id // empty' /tmp/comments.json 2>/dev/null); do
              curl -sS -o /tmp/cmt_$CID.json -w "I025RES comment_by_global_id id=$CID code=%{http_code}\n" "${H[@]}" "$API/pulls/comments/$CID"
              jq -c '{id,body,path,line,created_at,user:.user.login,pull_request_review_id}' /tmp/cmt_$CID.json 2>/dev/null || head -c 400 /tmp/cmt_$CID.json
            done
            echo "I025POSTSUBMIT repo_events:"
            curl -sS -o /tmp/rev.json -w 'I025RES repo_events code=%{http_code}\n' "${H[@]}" "$API/repos/$REPO/events?per_page=100"
            jq -c 'map({id,type,created_at,actor:.actor.login})' /tmp/rev.json 2>/dev/null | head -c 3000
            echo
            ;;
          delete_comment)
            if [ -n "$CID_IN" ]; then
              curl -sS -o /tmp/delc.json -w 'I025RES delete_comment code=%{http_code}\n' "${H[@]}" -X DELETE "$API/pulls/comments/$CID_IN"
              head -c 600 /tmp/delc.json
              echo
              curl -sS -o /tmp/comments.json "${H[@]}" "$API/pulls/$PR/comments?per_page=100"
              jq -c 'map({id,body,user:.user.login})' /tmp/comments.json 2>/dev/null | head -c 1200
              echo
            fi
            ;;
          esac
          echo "I025DONE phase=$PHASE pr=$PR ts=$TS"
