name: i028-pub-disc-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  discussions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Run discussion API probe
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time
          tok = os.environ["TOKEN"]; repo = os.environ["REPO"]
          def hit(method, path, data=None):
              req = urllib.request.Request("https://api.github.com"+path, data=(json.dumps(data).encode() if data is not None else None), method=method)
              req.add_header("Authorization", "Bearer "+tok)
              req.add_header("Accept", "application/vnd.github+json")
              if data is not None: req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      b = r.read().decode("utf-8", "replace")
                      return r.status, b[:4000]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:2000]
          print("=== user ===")
          print(hit("GET", "/user"))
          print("=== list discussions ===")
          st, b = hit("GET", "/repos/%s/discussions?per_page=100" % repo)
          print(st, b)
          try:
              arr = json.loads(b)
              if isinstance(arr, list):
                  print("COUNT", len(arr))
                  for d in arr:
                      print("D", d.get("number"), d.get("id"), d.get("title"), (d.get("body") or "")[:80], d.get("state"), "ans", bool(d.get("answer_chosen_at")), "cmt", d.get("comments"))
          except Exception as e:
              print("parse fail", e)
          print("=== categories ===")
          st, b = hit("GET", "/repos/%s/discussions" % repo)
          print("(categories unavailable via list; using graphql)")
          q = """query($o:String!,$n:String!){repository(owner:$o,name:$n){id databaseId hasDiscussionsEnabled discussions(first:20){totalCount nodes{number id databaseId title body isAnswered locked closed comments(first:50){totalCount nodes{id databaseId body isAnswer author{login}}}}} discussionCategories(first:30){nodes{id name slug isAnswerable}}}}"""
          body = json.dumps({"query": q, "variables": {"o": repo.split("/")[0], "n": repo.split("/")[1]}}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=body, method="POST")
          req.add_header("Authorization", "Bearer "+tok); req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print("GQL", r.status, r.read().decode()[:6000])
          except urllib.error.HTTPError as e:
              print("GQL ERR", e.code, e.read().decode()[:1000])
          print("=== REST POST create ===")
          ts = str(int(time.time()*1000))
          data = {"title": "i028 bot REST create %s" % ts, "body": "i028-bot-rest-create-%s marker from GITHUB_TOKEN" % ts, "category_id": 51637246}
          st, b = hit("POST", "/repos/%s/discussions" % repo, data)
          print(st, b)
          PY
