name: i034-readaudit-probe
on:
  workflow_dispatch:
    inputs:
      phase:
        description: probe phase
        required: true
        type: choice
        default: create_all
        options:
        - create_all
        - cleanup
      issue:
        description: issue number (cleanup)
        required: false
        default: ''
      pr:
        description: pull number (cleanup)
        required: false
        default: ''
      milestone:
        description: milestone number (cleanup)
        required: false
        default: ''
      label:
        description: label name (cleanup)
        required: false
        default: ''
      branch:
        description: head branch (cleanup)
        required: false
        default: ''
      headsha:
        description: pr head sha (cleanup, optional)
        required: false
        default: ''
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GT: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: run phase
        shell: bash
        env:
          PHASE: ${{ github.event.inputs.phase }}
          ISSUE_IN: ${{ github.event.inputs.issue }}
          PR_IN: ${{ github.event.inputs.pr }}
          MS_IN: ${{ github.event.inputs.milestone }}
          LABEL_IN: ${{ github.event.inputs.label }}
          BR_IN: ${{ github.event.inputs.branch }}
          HSHA_IN: ${{ github.event.inputs.headsha }}
        run: |
          set -u
          API="https://api.github.com/repos/$REPO"
          TS=$(date +%s%3N)
          H=(-H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json")
          echo "I034RUN repo=$REPO phase=$PHASE ts=$TS"
          emit() { echo "I034RES $1 code=$2"; }
          jtrim='{id,number,state,title,body,created_at,url,html_url,labels:[.labels[]?|{id,name,description,color}],milestone:(.milestone|{number,title,description,state}),assignees:[.assignees[]?|{login,id}],user:.user.login,head:(.head|{ref,sha,repo:.repo.full_name}),base:(.base|{ref,sha})}'

          case "$PHASE" in
          create_all)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # 1) repo label with marker
            LNAME="i034-label-$TS"
            LPAY=$(jq -n --arg n "$LNAME" --arg d "i034 marker label desc $TS" '{name:$n,color:"a034bc",description:$d}')
            CODE=$(curl -sS -o /tmp/label.json -w '%{http_code}' "${H[@]}" -X POST "$API/labels" --data "$LPAY")
            LID=$(jq -r '.id // empty' /tmp/label.json 2>/dev/null)
            emit label_create "$CODE"; jq -c '{id,name,description,color}' /tmp/label.json 2>/dev/null | head -c 600; echo

            # 2) repo milestone with marker
            MS="$TS"
            MPAY=$(jq -n --arg t "i034-milestone-$TS" --arg d "i034 marker milestone desc $TS" '{title:$t,description:$d,state:"open"}')
            CODE=$(curl -sS -o /tmp/ms.json -w '%{http_code}' "${H[@]}" -X POST "$API/milestones" --data "$MPAY")
            MN=$(jq -r '.number // empty' /tmp/ms.json 2>/dev/null)
            MID=$(jq -r '.id // empty' /tmp/ms.json 2>/dev/null)
            emit milestone_create "$CODE"; jq -c '{id,number,title,description,state,open_issues,closed_issues}' /tmp/ms.json 2>/dev/null | head -c 600; echo

            # 3) issue with label + milestone + assignee (owner has push)
            IB="i034 marker issue body $TS\nflag{i034-issue-body-$TS}"
            ASSIGNEES=("qret2libc")
            IPAY=$(jq -n --arg t "i034 issue $TS" --arg b "$IB" --arg l "$LNAME" --argjson ms "${MN:-0}" '{title:$t,body:$b,labels:[$l],milestone:$ms,assignees:["qret2libc"]}')
            CODE=$(curl -sS -o /tmp/iss.json -w '%{http_code}' "${H[@]}" -X POST "$API/issues" --data "$IPAY")
            IN=$(jq -r '.number // empty' /tmp/iss.json 2>/dev/null)
            emit issue_create "$CODE"; jq -c "$jtrim" /tmp/iss.json 2>/dev/null | head -c 1600; echo
            if [ -n "$IN" ]; then
              # add assignee if not in initial payload result
              CODE=$(curl -sS -o /tmp/as.json -w '%{http_code}' "${H[@]}" -X POST "$API/issues/$IN/assignees" --data '{"assignees":["qret2libc"]}')
              emit issue_assignee_add "$CODE"; jq -c '{assignees:[.assignees[]?|{login,id}]}' /tmp/as.json 2>/dev/null | head -c 500; echo
            fi

            # 4) branch + 2 commits (dependency manifest v1 -> v2) + PR
            BR="i034/pr-$TS"
            git checkout -b "$BR"
            mkdir -p i034-probe
            printf 'i034 pr head file marker %s\n' "$TS" > "i034-probe/head-$TS.txt"
            printf 'i034-dep-%s==1.0.0  # i034 marker dependency v1 %s\n' "$TS" "$TS" > "i034-probe/requirements-$TS.txt"
            git add "i034-probe"
            git commit -m "i034 commit v1 marker: $TS"
            SHA1=$(git rev-parse HEAD)
            printf 'i034-dep-%s==2.0.0  # i034 marker dependency v2 %s\n' "$TS" "$TS" > "i034-probe/requirements-$TS.txt"
            printf 'i034 pr head file v2 marker %s\n' "$TS" > "i034-probe/head2-$TS.txt"
            git add "i034-probe"
            git commit -m "i034 commit v2 marker: $TS"
            SHA2=$(git rev-parse HEAD)
            git push -u origin "$BR"
            PB="i034 pr $TS"
            PPAY=$(jq -n --arg t "$PB" --arg b "i034 pr body marker $TS" --arg h "$BR" '{title:$t,body:$b,head:$h,base:"main"}')
            CODE=$(curl -sS -o /tmp/pr.json -w '%{http_code}' "${H[@]}" -X POST "$API/pulls" --data "$PPAY")
            PN=$(jq -r '.number // empty' /tmp/pr.json 2>/dev/null)
            emit pr_create "$CODE"; jq -c '{number,id,state,title,body,head:{ref:.head.ref,sha:.head.sha},base:{ref:.base.ref,sha:.base.sha},user:.user.login}' /tmp/pr.json 2>/dev/null | head -c 1200; echo
            emit commit_v1 "$SHA1"; emit commit_v2 "$SHA2"

            # 5) topics
            TPAY='{"names":["i034-topic-probe","i034-topic-'"$TS"'"]}'
            CODE=$(curl -sS -o /tmp/top.json -w '%{http_code}' "${H[@]}" -X PUT "$API/topics" --data "$TPAY")
            emit topics_put "$CODE"; head -c 500 /tmp/top.json; echo

            # 6) repo-scope positive-control reads
            echo "I034READ labels_list:"; curl -sS -o /tmp/r1.json -w 'I034RES labels_list code=%{http_code}\n' "${H[@]}" "$API/labels?per_page=100"; jq -c '[.[]|select(.name|startswith("i034-label"))|{id,name,description}]' /tmp/r1.json 2>/dev/null | head -c 1500; echo
            echo "I034READ label_by_name:"; curl -sS -o /tmp/r2.json -w 'I034RES label_by_name code=%{http_code}\n' "${H[@]}" "$API/labels/$LNAME"; jq -c '{id,name,description,color}' /tmp/r2.json 2>/dev/null | head -c 600; echo
            echo "I034READ milestones_list:"; curl -sS -o /tmp/r3.json -w 'I034RES milestones_list code=%{http_code}\n' "${H[@]}" "$API/milestones?state=all&per_page=100"; jq -c '[.[]|select(.title|startswith("i034-milestone"))|{id,number,title,description,state,open_issues,closed_issues}]' /tmp/r3.json 2>/dev/null | head -c 1500; echo
            echo "I034READ milestone_by_num:"; curl -sS -o /tmp/r4.json -w 'I034RES milestone_by_num code=%{http_code}\n' "${H[@]}" "$API/milestones/$MN"; jq -c '{id,number,title,description,state}' /tmp/r4.json 2>/dev/null | head -c 600; echo
            echo "I034READ milestone_labels:"; curl -sS -o /tmp/r5.json -w 'I034RES milestone_labels code=%{http_code}\n' "${H[@]}" "$API/milestones/$MN/labels"; jq -c 'map({id,name,description})' /tmp/r5.json 2>/dev/null | head -c 1000; echo
            echo "I034READ issue_by_num:"; curl -sS -o /tmp/r6.json -w 'I034RES issue_by_num code=%{http_code}\n' "${H[@]}" "$API/issues/$IN"; jq -c "$jtrim" /tmp/r6.json 2>/dev/null | head -c 1800; echo
            echo "I034READ issue_labels:"; curl -sS -o /tmp/r7.json -w 'I034RES issue_labels code=%{http_code}\n' "${H[@]}" "$API/issues/$IN/labels"; jq -c 'map({id,name,description})' /tmp/r7.json 2>/dev/null | head -c 1000; echo
            echo "I034READ assignees_list:"; curl -sS -o /tmp/r8.json -w 'I034RES assignees_list code=%{http_code}\n' "${H[@]}" "$API/assignees?per_page=100"; jq -c 'map({login,id})' /tmp/r8.json 2>/dev/null | head -c 1000; echo
            echo "I034READ assignee_check_owner:"; curl -sS -o /tmp/r9.json -w 'I034RES assignee_check_owner code=%{http_code}\n' "${H[@]}" "$API/assignees/qret2libc"; head -c 300 /tmp/r9.json; echo
            echo "I034READ assignee_check_wyxxl:"; curl -sS -o /tmp/r10.json -w 'I034RES assignee_check_wyxxl code=%{http_code}\n' "${H[@]}" "$API/assignees/wyxxl"; head -c 300 /tmp/r10.json; echo
            echo "I034READ issue_assignee_check_owner:"; curl -sS -o /tmp/r11.json -w 'I034RES issue_assignee_check_owner code=%{http_code}\n' "${H[@]}" "$API/issues/$IN/assignees/qret2libc"; head -c 300 /tmp/r11.json; echo
            echo "I034READ issue_assignee_check_wyxxl:"; curl -sS -o /tmp/r12.json -w 'I034RES issue_assignee_check_wyxxl code=%{http_code}\n' "${H[@]}" "$API/issues/$IN/assignees/wyxxl"; head -c 300 /tmp/r12.json; echo
            echo "I034READ topics:"; curl -sS -o /tmp/r13.json -w 'I034RES topics code=%{http_code}\n' "${H[@]}" "$API/topics"; head -c 500 /tmp/r13.json; echo
            echo "I034READ commit_pulls_head:"; curl -sS -o /tmp/r14.json -w 'I034RES commit_pulls_head code=%{http_code}\n' "${H[@]}" "$API/commits/$SHA2/pulls"; jq -c 'map({number,title,state,head:.head.ref})' /tmp/r14.json 2>/dev/null | head -c 1000; echo
            echo "I034READ commit_pulls_main:"; curl -sS -o /tmp/r15.json -w 'I034RES commit_pulls_main code=%{http_code}\n' "${H[@]}" "$API/commits/main/pulls"; jq -c 'map({number,title,state})' /tmp/r15.json 2>/dev/null | head -c 1000; echo
            echo "I034READ branches_where_head:"; curl -sS -o /tmp/r16.json -w 'I034RES branches_where_head code=%{http_code}\n' "${H[@]}" "$API/commits/$SHA2/branches-where-head"; jq -c 'map({name})' /tmp/r16.json 2>/dev/null | head -c 800; echo
            echo "I034READ depgraph_compare:"; curl -sS -o /tmp/r17.json -w 'I034RES depgraph_compare code=%{http_code}\n' "${H[@]}" "$API/dependency-graph/compare/$SHA1...$SHA2"; head -c 1200 /tmp/r17.json; echo
            echo "I034READ readme:"; curl -sS -o /tmp/r18.json -w 'I034RES readme code=%{http_code}\n' "${H[@]}" "$API/readme"; jq -c '{name,path,sha,size,encoding,download_url}' /tmp/r18.json 2>/dev/null | head -c 800; echo
            echo "I034READ autolinks:"; curl -sS -o /tmp/r19.json -w 'I034RES autolinks code=%{http_code}\n' "${H[@]}" "$API/autolinks"; head -c 400 /tmp/r19.json; echo
            echo "I034READ pages:"; curl -sS -o /tmp/r20.json -w 'I034RES pages code=%{http_code}\n' "${H[@]}" "$API/pages"; head -c 400 /tmp/r20.json; echo

            echo "I034OBJ ts=$TS label=$LNAME label_id=$LID milestone=$MN milestone_id=$MID issue=$IN pr=$PN branch=$BR sha1=$SHA1 sha2=$SHA2 repo=$REPO"
            ;;

          cleanup)
            IN="$ISSUE_IN"; PN="$PR_IN"; MN="$MS_IN"; LNAME="$LABEL_IN"; BR="$BR_IN"; HSHA="$HSHA_IN"
            echo "I034CLEAN issue=$IN pr=$PN milestone=$MN label=$LNAME branch=$BR headsha=$HSHA repo=$REPO"
            if [ -n "$IN" ]; then
              CODE=$(curl -sS -o /tmp/c1.json -w '%{http_code}' "${H[@]}" -X POST "$API/issues/$IN/assignees" --data '{"assignees":[]}')
              emit unassign_issue "$CODE"; head -c 300 /tmp/c1.json; echo
            fi
            if [ -n "$PN" ]; then
              CODE=$(curl -sS -o /tmp/c2.json -w '%{http_code}' "${H[@]}" -X PATCH "$API/pulls/$PN" --data '{"state":"closed"}')
              emit close_pr "$CODE"; head -c 300 /tmp/c2.json; echo
            fi
            if [ -n "$IN" ]; then
              CODE=$(curl -sS -o /tmp/c3.json -w '%{http_code}' "${H[@]}" -X PATCH "$API/issues/$IN" --data '{"state":"closed","labels":[]}')
              emit close_issue "$CODE"; head -c 300 /tmp/c3.json; echo
              if [ -n "$LNAME" ]; then
                CODE=$(curl -sS -o /tmp/c4.json -w '%{http_code}' "${H[@]}" -X DELETE "$API/issues/$IN/labels/$LNAME")
                emit remove_label_from_issue "$CODE"; head -c 300 /tmp/c4.json; echo
              fi
            fi
            if [ -n "$LNAME" ]; then
              CODE=$(curl -sS -o /tmp/c5.json -w '%{http_code}' "${H[@]}" -X DELETE "$API/labels/$LNAME")
              emit delete_label "$CODE"; head -c 300 /tmp/c5.json; echo
            fi
            if [ -n "$MN" ]; then
              CODE=$(curl -sS -o /tmp/c6.json -w '%{http_code}' "${H[@]}" -X DELETE "$API/milestones/$MN")
              emit delete_milestone "$CODE"; head -c 300 /tmp/c6.json; echo
            fi
            if [ -n "$BR" ]; then
              git push origin --delete "$BR" 2>/dev/null || true
              emit delete_branch "done"
            fi
            CODE=$(curl -sS -o /tmp/c7.json -w '%{http_code}' "${H[@]}" -X PUT "$API/topics" --data '{"names":[]}')
            emit clear_topics "$CODE"; head -c 300 /tmp/c7.json; echo
            if [ -n "$HSHA" ]; then
              echo "I034CLEAN postdelete reads (repo-scope):"
              for u in "labels/$LNAME" "milestones/$MN" "issues/$IN" "pulls/$PN" "commits/$HSHA/pulls" "topics"; do
                curl -sS -o /tmp/pd.json -w "I034RES postdelete_${u//\//_} code=%{http_code}\n" "${H[@]}" "$API/$u"
                head -c 400 /tmp/pd.json; echo
              done
            fi
            ;;
          esac
          echo "I034DONE phase=$PHASE ts=$TS"
